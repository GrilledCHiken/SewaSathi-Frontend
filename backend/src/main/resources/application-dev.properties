# Local development profile. Tracked in git, so it must never contain secrets -
# those live in application.properties (gitignored) or environment variables.

# Hibernate can create/patch tables in place while the schema is still moving.
spring.jpa.hibernate.ddl-auto=update

# SQL logging via the logging framework rather than spring.jpa.show-sql, so it
# obeys logback's appenders and can be silenced without an app restart.
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.sewasathi=DEBUG
logging.level.org.springframework.security=DEBUG

# Full health detail locally; production keeps this behind an admin check.
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info,metrics,loggers,env,mappings

app.cors.allowed-origins=http://localhost:5173,http://localhost:5174
