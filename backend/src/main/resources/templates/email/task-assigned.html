<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/fragments/layout :: page(
          'Your booking is confirmed',
          'A worker has been assigned to your task.',
          ~{::#content})}">
<head><meta charset="UTF-8"/><title>Your task has a worker</title></head>
<body>
<div id="content">

    <p style="margin:0 0 12px;font-size:15px;line-height:1.65;color:#334155;">
        Hi <span th:text="${name}">there</span>,
    </p>
    <p style="margin:0;font-size:15px;line-height:1.65;color:#334155;">
        <strong th:text="${workerName}">Your worker</strong> is confirmed for your booking. You can
        message them directly from your dashboard to agree on timing and access.
    </p>

    <th:block th:replace="~{email/fragments/components :: details(${details})}"/>
    <th:block th:replace="~{email/fragments/components :: button(${actionUrl}, 'Open my dashboard')}"/>

</div>
</body>
</html>
