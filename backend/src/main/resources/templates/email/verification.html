<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/fragments/layout :: page(
          'Confirm your email address',
          'One click to activate your Sewa Sathi account.',
          ~{::#content})}">
<head><meta charset="UTF-8"/><title>Verify your email</title></head>
<body>
<div id="content">

    <p style="margin:0 0 12px;font-size:15px;line-height:1.65;color:#334155;">
        Hi <span th:text="${name}">there</span>,
    </p>
    <p style="margin:0;font-size:15px;line-height:1.65;color:#334155;">
        Welcome to Sewa Sathi. Confirm your email address to activate your account and start
        booking trusted local help.
    </p>

    <th:block th:replace="~{email/fragments/components :: button(${actionUrl}, 'Verify my email')}"/>

    <p style="margin:0;font-size:14px;line-height:1.65;color:#64748b;">
        This link expires on <strong th:text="${expiresAt}">the date shown</strong>. If it lapses
        you can request a new one from the sign-in page.
    </p>
    <p style="margin:12px 0 0;font-size:14px;line-height:1.65;color:#64748b;">
        Didn't create this account? You can safely ignore this email.
    </p>

    <th:block th:replace="~{email/fragments/components :: linkFallback(${actionUrl})}"/>

</div>
</body>
</html>
