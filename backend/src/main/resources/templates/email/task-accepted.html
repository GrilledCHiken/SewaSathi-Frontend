<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/fragments/layout :: page(
          'Your task has been accepted',
          'A worker said yes - pay the advance to confirm the booking.',
          ~{::#content})}">
<head><meta charset="UTF-8"/><title>Your task has been accepted</title></head>
<body>
<div id="content">

    <p style="margin:0 0 12px;font-size:15px;line-height:1.65;color:#334155;">
        Hi <span th:text="${name}">there</span>,
    </p>
    <p style="margin:0;font-size:15px;line-height:1.65;color:#334155;">
        <span th:text="${workerName}">A worker</span> has accepted your task
        &ldquo;<span th:text="${taskTitle}">your task</span>&rdquo;.
    </p>

    <p style="margin:16px 0 0;font-size:15px;line-height:1.65;color:#334155;">
        To go further, a <span th:text="${advancePercent}">10%</span> advance payment is now due.
        It confirms the booking and locks in your worker - until it clears they cannot start,
        and the job stays on hold. The rest is only owed once the work is finished.
    </p>

    <th:block th:replace="~{email/fragments/components :: button(${tasksUrl}, 'Pay the advance')}"/>
    <th:block th:replace="~{email/fragments/components :: linkFallback(${tasksUrl})}"/>

</div>
</body>
</html>
