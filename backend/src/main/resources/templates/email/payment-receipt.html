<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/fragments/layout :: page(
          'Payment received',
          'Your advance payment has been confirmed.',
          ~{::#content})}">
<head><meta charset="UTF-8"/><title>Payment receipt</title></head>
<body>
<div id="content">

    <p style="margin:0 0 12px;font-size:15px;line-height:1.65;color:#334155;">
        Hi <span th:text="${name}">there</span>,
    </p>
    <p style="margin:0;font-size:15px;line-height:1.65;color:#334155;">
        We have received your advance payment and your booking is confirmed. Keep this receipt for
        your records.
    </p>

    <th:block th:replace="~{email/fragments/components :: details(${details})}"/>

    <p style="margin:0;font-size:14px;line-height:1.65;color:#64748b;">
        This is the advance portion of your booking. The remaining balance is settled directly with
        your worker once the job is complete.
    </p>

    <th:block th:replace="~{email/fragments/components :: button(${actionUrl}, 'View my payments')}"/>

</div>
</body>
</html>
