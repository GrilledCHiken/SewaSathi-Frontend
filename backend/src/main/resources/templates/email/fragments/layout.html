<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="page(heading, preheader, content)">
<!--
  Document shell shared by every transactional email.

  Each email template passes its body in as the `content` fragment expression, so this
  file owns the whole wrapper. It cannot be split into separate "header"/"footer"
  fragments that open and close the same table: Thymeleaf balances tags within a
  fragment, so the unclosed <table> in a header fragment would be auto-closed and the
  layout would collapse.

  Email clients are not browsers - Outlook renders through Word's HTML engine and several
  clients drop <style> blocks - so this uses table layout with inline styles rather than
  the Tailwind classes the web app uses. Colours mirror the brand tokens in
  frontend/SewaSathi/src/index.css (#2b8cff brand, #05070a navy).
-->
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${heading}">Sewa Sathi</title>
</head>
<body style="margin:0;padding:0;background-color:#f1f5f9;">

<!-- Inbox preview line: shown next to the subject, hidden inside the message body. -->
<div th:text="${preheader}"
     style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;height:0;width:0;">
</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background-color:#f1f5f9;padding:24px 12px;font-family:'Segoe UI',Helvetica,Arial,sans-serif;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                   style="max-width:560px;background-color:#ffffff;border-radius:12px;overflow:hidden;">
                <tr>
                    <td style="background-color:#05070a;padding:20px 32px;">
                        <span style="color:#ffffff;font-size:19px;font-weight:700;letter-spacing:-0.3px;">Sewa</span><span
                            style="color:#2b8cff;font-size:19px;font-weight:700;letter-spacing:-0.3px;">Sathi</span>
                    </td>
                </tr>
                <tr>
                    <td style="padding:32px;">
                        <h1 th:text="${heading}"
                            style="margin:0 0 16px;font-size:21px;line-height:1.3;color:#05070a;font-weight:650;">
                            Heading
                        </h1>
                        <th:block th:replace="${content}"/>
                    </td>
                </tr>
                <tr>
                    <td style="padding:20px 32px 28px;border-top:1px solid #e2e8f0;">
                        <p style="margin:0 0 6px;font-size:12px;line-height:1.6;color:#64748b;">
                            You received this email because you have a Sewa Sathi account.
                        </p>
                        <p style="margin:0;font-size:12px;line-height:1.6;color:#94a3b8;">
                            Sewa Sathi &mdash; trusted local services across Nepal.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>

</body>
</html>
