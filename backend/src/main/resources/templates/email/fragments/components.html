<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  Reusable pieces used inside email bodies. Kept in their own file rather than in
  layout.html, because everything in that file lives inside the `page` fragment and
  would be emitted as part of the page wrapper.
-->
<body>

<!--
  Call-to-action button. A table rather than a styled <a>, because Outlook ignores
  padding on inline anchors, which would collapse the button into plain text.
-->
<table th:fragment="button(url, label)" role="presentation" cellpadding="0" cellspacing="0" border="0"
       style="margin:24px 0;">
    <tr>
        <td align="center" style="border-radius:8px;background-color:#2b8cff;">
            <a th:href="${url}" th:text="${label}"
               style="display:inline-block;padding:12px 28px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:8px;">
                Continue
            </a>
        </td>
    </tr>
</table>

<!-- Plain-text URL for clients that strip the button, and for copy/paste. -->
<p th:fragment="linkFallback(url)"
   style="margin:16px 0 0;font-size:12px;line-height:1.6;color:#64748b;">
    If the button does not work, copy and paste this link into your browser:<br/>
    <span th:text="${url}" style="color:#2b8cff;word-break:break-all;">https://example.com</span>
</p>

<!-- Two-column detail row used by the receipt / alert / assignment emails. -->
<table th:fragment="details(rows)" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="margin:20px 0;background-color:#f8fafc;border-radius:8px;">
    <tr th:each="row : ${rows}">
        <td style="padding:12px 16px;font-size:14px;color:#475569;width:38%;vertical-align:top;"
            th:text="${row.key}">Label
        </td>
        <td style="padding:12px 16px;font-size:14px;color:#05070a;font-weight:600;vertical-align:top;"
            th:text="${row.value}">Value
        </td>
    </tr>
</table>

<!-- Amber advisory box. -->
<p th:fragment="notice(text)"
   th:text="${text}"
   style="margin:12px 0 0;padding:12px 14px;background-color:#fef3c7;border-radius:8px;font-size:14px;line-height:1.6;color:#78350f;">
    Notice
</p>

<!-- Red security warning box. -->
<p th:fragment="warning(text)"
   th:text="${text}"
   style="margin:12px 0 0;padding:12px 14px;background-color:#fee2e2;border-radius:8px;font-size:14px;line-height:1.6;color:#7f1d1d;">
    Warning
</p>

</body>
</html>
