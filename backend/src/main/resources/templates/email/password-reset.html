<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/fragments/layout :: page(
          'Reset your password',
          'A link to set a new Sewa Sathi password.',
          ~{::#content})}">
<head><meta charset="UTF-8"/><title>Reset your password</title></head>
<body>
<div id="content">

    <p style="margin:0 0 12px;font-size:15px;line-height:1.65;color:#334155;">
        Hi <span th:text="${name}">there</span>,
    </p>
    <p style="margin:0;font-size:15px;line-height:1.65;color:#334155;">
        We received a request to reset the password for your Sewa Sathi account. Choose a new one
        using the button below.
    </p>

    <th:block th:replace="~{email/fragments/components :: button(${actionUrl}, 'Choose a new password')}"/>

    <p style="margin:0;font-size:14px;line-height:1.65;color:#64748b;">
        This link works once and expires in <strong th:text="${expiryMinutes}">60</strong> minutes.
    </p>

    <th:block th:replace="~{email/fragments/components :: notice(
        'If you did not request this, no action is needed - your password stays unchanged. If these
         keep arriving, someone may know your email address, so consider changing your password
         next time you sign in.')}"/>

    <th:block th:replace="~{email/fragments/components :: linkFallback(${actionUrl})}"/>

</div>
</body>
</html>
