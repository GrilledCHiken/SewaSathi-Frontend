<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/fragments/layout :: page(
          'New sign-in to your account',
          'A new device just signed in to Sewa Sathi.',
          ~{::#content})}">
<head><meta charset="UTF-8"/><title>New sign-in to your account</title></head>
<body>
<div id="content">

    <p style="margin:0 0 12px;font-size:15px;line-height:1.65;color:#334155;">
        Hi <span th:text="${name}">there</span>,
    </p>
    <p style="margin:0;font-size:15px;line-height:1.65;color:#334155;">
        Your Sewa Sathi account was just accessed from a device we had not seen before.
    </p>

    <th:block th:replace="~{email/fragments/components :: details(${details})}"/>

    <p style="margin:0;font-size:14px;line-height:1.65;color:#64748b;">
        If this was you, nothing further is needed.
    </p>

    <th:block th:replace="~{email/fragments/components :: warning(
        'If it was not you, change your password immediately and turn on two-factor
         authentication from your account settings.')}"/>

</div>
</body>
</html>
