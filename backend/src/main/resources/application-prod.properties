# Production profile. Tracked in git, so every secret is read from an environment
# variable and nothing sensitive is written here. Fail fast: the ${VAR} references
# below have no defaults, so the app refuses to start with missing configuration
# rather than silently falling back to development values.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Never let Hibernate rewrite a production schema. Validate against it and fail
# loudly if the entities and the live tables have drifted apart.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=false

jwt.secret=${JWT_SECRET}

app.frontend-url=${FRONTEND_URL}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Khalti's live gateway, not the dev sandbox the base profile points at. The secret
# has no default on purpose: a production boot without KHALTI_SECRET_KEY should fail
# here rather than reach checkout and tell a paying customer it is unconfigured.
app.khalti.initiate-url=https://khalti.com/api/v2/epayment/initiate/
app.khalti.lookup-url=https://khalti.com/api/v2/epayment/lookup/
app.khalti.secret-key=${KHALTI_SECRET_KEY}

# Session cookies must never travel in the clear in production, and a shorter idle
# window limits how long an unattended admin console stays usable.
server.servlet.session.timeout=15m
server.servlet.session.cookie.secure=true

# No default administrator in production - the account is provisioned deliberately.
app.admin.bootstrap.enabled=false

logging.level.root=WARN
logging.level.com.sewasathi=INFO
logging.level.org.hibernate.SQL=WARN

# Health details only for authenticated admins; no env/mappings dumps in production.
management.endpoint.health.show-details=when-authorized
management.endpoints.web.exposure.include=health,info,metrics
