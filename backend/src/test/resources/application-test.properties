# Test profile: everything runs against an in-memory H2 database so `./mvnw verify`
# never touches (or requires) the developer's local MySQL instance.
spring.datasource.url=jdbc:h2:mem:sewasathi;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Deterministic throwaway signing key - never used outside tests.
jwt.secret=dGVzdC1vbmx5LXNlY3JldC1rZXktZm9yLXNld2FzYXRoaS11bml0LWFuZC1pbnRlZ3JhdGlvbi10ZXN0cw==
# Deliberately long in tests: a 15-minute access token would make the existing suite's
# assertions depend on wall-clock timing. Expiry behaviour is covered directly instead.
jwt.expiration-ms=86400000
jwt.refresh-expiration-ms=604800000
app.session.idle-timeout-ms=1800000

app.upload-dir=${java.io.tmpdir}/sewasathi-test-uploads
app.frontend-url=http://localhost:5173
app.cors.allowed-origins=http://localhost:5173

# Payment gateways are never called for real in tests; the service-layer tests mock
# RestClient, and these values only need to be present so @Value injection resolves.
app.esewa.form-url=https://rc-epay.esewa.com.np/api/epay/main/v2/form
app.esewa.status-url=https://rc.esewa.com.np/api/epay/transaction/status/
app.esewa.merchant-code=EPAYTEST
app.esewa.secret-key=8gBm/:&EnhH.1/q
app.esewa.advance-rate=0.10
app.khalti.initiate-url=https://dev.khalti.com/api/v2/epayment/initiate/
app.khalti.lookup-url=https://dev.khalti.com/api/v2/epayment/lookup/
app.khalti.secret-key=test-secret-key

# Session settings for the admin-console tests. Restated here rather than inherited,
# because application.properties is gitignored and absent on a fresh clone or on CI -
# anything the tests rely on has to live in this file.
server.servlet.session.timeout=30m
server.error.whitelabel.enabled=false

# A deterministic administrator for the admin-console tests to sign in as.
app.admin.bootstrap.enabled=true
app.admin.bootstrap.email=admin@sewasathi.test
app.admin.bootstrap.password=AdminTest1!
app.admin.bootstrap.full-name=Test Administrator
app.admin.bootstrap.phone=9800000001

logging.level.root=WARN
logging.level.com.sewasathi=INFO
