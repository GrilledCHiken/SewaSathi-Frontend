<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `interactive-widget=resizes-content` makes the on-screen keyboard shrink
      the layout viewport instead of panning it, so the dvh-sized chat shell
      keeps its composer above the keyboard rather than sliding out of view.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2b8cff" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>SewaSathi — Trusted Home Services in Nepal</title>
    <meta
      name="description"
      content="Book trusted, verified home service professionals across Nepal — cleaning, repairs, electrical, plumbing and more."
    />

    <!--
      og:image and og:url must be absolute, so they carry the production origin
      rather than a relative path. Update both if the domain changes.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SewaSathi" />
    <meta property="og:title" content="SewaSathi — Trusted Home Services in Nepal" />
    <meta
      property="og:description"
      content="Book trusted, verified home service professionals across Nepal — cleaning, repairs, electrical, plumbing and more."
    />
    <meta property="og:url" content="https://sewasathi.com.np/" />
    <meta property="og:image" content="https://sewasathi.com.np/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SewaSathi — Trusted Home Services in Nepal" />
    <meta
      name="twitter:description"
      content="Book trusted, verified home service professionals across Nepal — cleaning, repairs, electrical, plumbing and more."
    />
    <meta name="twitter:image" content="https://sewasathi.com.np/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
